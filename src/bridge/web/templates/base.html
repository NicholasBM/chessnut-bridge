<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Chess board bridge{% endblock %}</title>
<style>
  /* Inline rather than a static file: one fewer route, one fewer thing to get
     out of step with the HTML, and the whole sheet is smaller than the request
     it would take to fetch it. */
  :root {
    --ink: #1c1917;
    --quiet: #57534e;
    --line: #e7e5e4;
    --ok: #15803d;
    --attention: #b45309;
    --error: #b91c1c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto; padding: 1.5rem 1rem 4rem; max-width: 40rem;
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink); background: #fafaf9;
  }
  h1 { font-size: 1.25rem; margin: 0 0 1.25rem; }
  h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em;
       color: var(--quiet); margin: 2rem 0 0.5rem; }
  p { margin: 0.35rem 0; }
  .quiet { color: var(--quiet); font-size: 0.9rem; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 8px;
          padding: 0.9rem 1rem; }
  .headline { font-size: 1.1rem; font-weight: 600; border-left: 4px solid var(--line);
              padding-left: 0.75rem; }
  .headline.ok { border-color: var(--ok); }
  .headline.attention { border-color: var(--attention); }
  .headline.error { border-color: var(--error); }
  .squares { font-family: ui-monospace, monospace; letter-spacing: 0.08em; }
  form.inline { display: inline; }
  button {
    font: inherit; padding: 0.4rem 0.8rem; border-radius: 6px;
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    cursor: pointer;
  }
  button:hover { background: #f5f5f4; }
  button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  button.danger { color: var(--error); }
  ul.games { list-style: none; padding: 0; margin: 0; }
  ul.games li { border-bottom: 1px solid var(--line); padding: 0.7rem 0;
                display: flex; gap: 0.75rem; align-items: baseline; }
  ul.games li:last-child { border-bottom: 0; }
  ul.games .grow { flex: 1; }
  .tag { font-size: 0.75rem; padding: 0.1rem 0.4rem; border-radius: 4px;
         background: #f5f5f4; color: var(--quiet); white-space: nowrap; }
  .tag.now { background: #fef3c7; color: #92400e; }
  label { display: block; margin-bottom: 0.35rem; }
  input[type=password], input[type=text] {
    font: inherit; width: 100%; padding: 0.5rem; border-radius: 6px;
    border: 1px solid var(--line);
  }
  input[type=checkbox] { width: auto; margin-right: 0.35rem; }
  a { color: var(--ink); }
  code { background: #f5f5f4; padding: 0.1rem 0.3rem; border-radius: 3px;
         font-size: 0.9em; }
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
